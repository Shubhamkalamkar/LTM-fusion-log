AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Oracle Fusion Cloud & OIC Job Failure Monitoring Web Application.
  Serverless architecture: Angular 20 SPA (S3/CloudFront) -> Amazon API Gateway -> Node.js AWS Lambda -> Amazon RDS for MySQL.

Parameters:
  DbMode:
    Type: String
    Default: mysql
    AllowedValues: [mysql, memory]
  DbHost:
    Type: String
    Default: your-rds-endpoint.rds.amazonaws.com
  DbPort:
    Type: Number
    Default: 3306
  DbName:
    Type: String
    Default: oracle_monitoring
  DbSecretArn:
    Type: String
    Default: ""
    Description: Optional AWS Secrets Manager ARN holding RDS MySQL credentials
  CorrelationWindowMinutes:
    Type: Number
    Default: 15
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional private subnet IDs for Lambda-to-RDS VPC access
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional security group IDs for Lambda-to-RDS VPC access

Conditions:
  UseVpc: !Not [!Equals [!Join ["", !Ref VpcSubnetIds], ""]]
  UseSecret: !Not [!Equals [!Ref DbSecretArn, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DB_MODE: !Ref DbMode
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_SECRET_ARN: !Ref DbSecretArn
        CORRELATION_WINDOW_MINUTES: !Ref CorrelationWindowMinutes
    VpcConfig:
      !If
      - UseVpc
      - SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      - !Ref AWS::NoValue

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - !If
          - UseSecret
          - PolicyName: ReadRdsSecret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref DbSecretArn
          - !Ref AWS::NoValue

  MonitoringApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: OracleCloudMonitoringApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Request-Id'"
        AllowOrigin: "'*'"

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oracle-monitor-dashboard
      CodeUri: ../backend
      Handler: src/handlers/dashboard.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        GetSummary:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /dashboard/summary
            Method: get
        GetMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /dashboard/metadata
            Method: get

  FusionJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oracle-monitor-fusion-jobs
      CodeUri: ../backend
      Handler: src/handlers/fusionJobs.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ListJobs:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /fusion/jobs
            Method: get
        ListFailedJobs:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /fusion/jobs/failed
            Method: get
        GetJobDetail:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /fusion/jobs/{executionId}
            Method: get

  OicIntegrationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oracle-monitor-oic-integrations
      CodeUri: ../backend
      Handler: src/handlers/oicIntegrations.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ListOic:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /oic/integrations
            Method: get
        ListFailedOic:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /oic/integrations/failed
            Method: get
        GetOicDetail:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /oic/integrations/{instanceId}
            Method: get

  IncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oracle-monitor-incidents
      CodeUri: ../backend
      Handler: src/handlers/incidents.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ListIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /incidents
            Method: get
        GetIncident:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /incidents/{incidentId}
            Method: get
        UpdateIncidentStatus:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /incidents/{incidentId}/status
            Method: put
        RetryIncident:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /incidents/{incidentId}/retry
            Method: post

  DataGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: oracle-monitor-data-generator
      CodeUri: ../backend
      Handler: src/handlers/dataGenerator.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ScheduledTick:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Inserts simulated Oracle Fusion or OIC execution events every 5 minutes
        ManualTrigger:
          Type: Api
          Properties:
            RestApiId: !Ref MonitoringApi
            Path: /simulator/tick
            Method: post

Outputs:
  ApiEndpoint:
    Description: Amazon API Gateway production base URL
    Value: !Sub "https://${MonitoringApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
